
<div class="shell">
  <header class="top">
    <div>
      <h1>끝말잇기</h1>
      <p class="score" id="score">이어간 단어 0 · 내 단어 0</p>
    </div>
    <button type="button" class="btn" id="newGame">새 게임</button>
  </header>

  <div class="claude-row" id="claudeRow">
    <label class="sw">
      <input type="checkbox" role="switch" id="claudeSw" disabled>
      <span class="track" aria-hidden="true"><span class="knob"></span></span>
      <span class="sw-text">Claude 사전 확인</span>
    </label>
    <span class="sw-state" id="swState" aria-live="polite"></span>
  </div>

  <div class="settings">
    <div class="seg" role="radiogroup" aria-label="앱 출력 방식">
      <input type="radio" name="out" id="out-text" value="text"><label for="out-text">글자</label>
      <input type="radio" name="out" id="out-voice" value="voice"><label for="out-voice">음성</label>
      <input type="radio" name="out" id="out-both" value="both" checked><label for="out-both">둘 다</label>
    </div>
    <select id="level" aria-label="난이도">
      <option value="easy">쉬움</option>
      <option value="normal" selected>보통</option>
      <option value="hard">어려움</option>
    </select>
  </div>

  <div class="timer-row" id="timerRow">
    <label class="sw">
      <input type="checkbox" role="switch" id="timeSw">
      <span class="track" aria-hidden="true"><span class="knob"></span></span>
      <span class="sw-text">시간제한 20초</span>
    </label>
    <div class="timebar" id="timebar" role="progressbar" aria-label="남은 시간" aria-valuemin="0" aria-valuemax="20" aria-valuenow="20" hidden><div class="fill" id="timefill"></div></div>
    <span class="timer-hint" id="timerHint">내 차례에만 적용돼요</span>
  </div>

  <main class="play">
    <section class="stage" id="stage" aria-live="polite"></section>
    <ol class="chain" id="chain" aria-label="최근에 이어간 단어"></ol>
  </main>

  <p class="status" id="status" role="status" aria-live="polite"></p>

  <form class="bar" id="form" autocomplete="off">
    <input type="text" id="word" placeholder="단어를 입력하세요" enterkeyhint="send" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="내 단어">
    <button type="button" class="icon-btn" id="mic" aria-label="음성으로 입력" title="음성으로 입력">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button type="submit" class="send" id="send">보내기</button>
  </form>
</div>

<script id="ui">
(function () {
  const $ = id => document.getElementById(id);
  const els = { score: $('score'), stage: $('stage'), chain: $('chain'), status: $('status'), form: $('form'), word: $('word'), mic: $('mic'), level: $('level'), newGame: $('newGame'), sw: $('claudeSw'), swState: $('swState'), claudeRow: $('claudeRow'), timeSw: $('timeSw'), timebar: $('timebar'), timefill: $('timefill'), timerHint: $('timerHint') };
  const SHOW = 4; // words kept on screen
  const TIME_LIMIT_MS = 20000; // FIX-01: 시간제한 20초 (사용자 결정)

  const ICON_SPK = '<svg class="spk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
  const ICON_SPK_BIG = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';

  let state;
  let busy = false;
  let listening = false;
  let rec = null;

  const NATIVE = window.KK_NATIVE || null; // set by native.js inside the Android app
  const hasTTS = !!NATIVE || ('speechSynthesis' in window && 'SpeechSynthesisUtterance' in window);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  function mode() { const r = document.querySelector('input[name="out"]:checked'); return r ? r.value : 'both'; }
  function setStatus(msg, err) { els.status.textContent = msg || ''; els.status.classList.toggle('err', !!err); }

  /* ---------- speech out ---------- */
  function koVoice() {
    if (!hasTTS) return null;
    const vs = speechSynthesis.getVoices();
    return vs.find(v => /^ko/i.test(v.lang)) || null;
  }
  function stopSpeech() {
    try {
      if (NATIVE) NATIVE.TextToSpeech.stop().catch(() => {});
      else if (hasTTS) speechSynthesis.cancel();
    } catch (e) {}
  }
  function speak(text) {
    if (!hasTTS) return;
    if (NATIVE) {
      NATIVE.TextToSpeech.speak({ text, lang: 'ko-KR', rate: 0.95, pitch: 1.0, volume: 1.0 }).catch(() => {
        setStatus('음성 출력에 실패했어요. 휴대폰 설정에서 텍스트 음성 변환(TTS) 엔진을 확인해 주세요.', true);
      });
      return;
    }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = 0.95;
      const v = koVoice(); if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (e) { /* speech output is optional */ }
  }
  if (hasTTS && !NATIVE) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (e) {} }

  /* ---------- Claude dictionary switch ---------- */
  // states: unavail (not opened inside Claude), checking, off, busy (asking permission), on, denied
  const WORD_SET = new Set(WORDS);
  const verdicts = new Map();
  let claudeState = 'unavail';
  let sampleFn = null;
  function saved() { try { return localStorage.getItem('kk-claude') === '1'; } catch (e) { return false; } }
  function save(v) { try { localStorage.setItem('kk-claude', v ? '1' : '0'); } catch (e) {} }
  const SW_TEXT = {
    unavail: NATIVE ? '사용 불가 · 앱 버전은 Claude 연결이 없어요' : '사용 불가 · Claude 앱 밖에서 실행 중',
    checking: '연결 확인 중…',
    off: '꺼짐 · 한글 두 글자 이상이면 인정',
    busy: '허용 요청 중…',
    on: '켜짐 · 목록에 없는 단어를 Claude가 확인',
    denied: '허용되지 않아 꺼졌어요'
  };
  function paintClaude() {
    els.sw.checked = claudeState === 'on' || claudeState === 'busy';
    els.sw.disabled = claudeState === 'unavail' || claudeState === 'checking' || claudeState === 'busy';
    els.swState.textContent = SW_TEXT[claudeState];
  }
  if (window.claude && window.claude.use) {
    claudeState = 'checking';
    window.claude.use('sample').then(f => {
      sampleFn = f || null;
      claudeState = f ? (saved() ? 'on' : 'off') : 'unavail';
      paintClaude();
    }).catch(() => { claudeState = 'unavail'; paintClaude(); });
  }
  paintClaude();

  els.sw.addEventListener('change', async () => {
    if (!sampleFn) { paintClaude(); return; }
    if (!els.sw.checked) { claudeState = 'off'; save(false); paintClaude(); return; }
    claudeState = 'busy'; paintClaude();
    try {
      await sampleFn.json('JSON만 답하세요: {"ok": true}', { modelTier: 'quick' });
      claudeState = 'on'; save(true); setStatus('');
    } catch (e) {
      if (e && e.code === 'not_granted') { claudeState = 'denied'; save(false); }
      else { claudeState = 'off'; setStatus('Claude 연결에 실패했어요. 잠시 뒤 다시 켜 주세요.', true); }
    }
    paintClaude();
  });
  els.claudeRow.addEventListener('click', () => {
    if (claudeState === 'unavail') setStatus((NATIVE ? '설치한 앱에는 Claude 연결이 없어서 ' : 'Claude 사전 확인은 Claude 앱 안에서 열었을 때만 쓸 수 있어요. ') + '지금은 한글 두 글자 이상이면 단어로 인정해요.');
  });

  async function isWord(w) {
    if (WORD_SET.has(w)) return { ok: true };
    if (verdicts.has(w)) return verdicts.get(w);
    if (claudeState !== 'on' || !sampleFn) return { ok: true, skipped: true };
    const prompt = '한국어 끝말잇기 심판입니다. 아래 단어가 국어사전(표준국어대사전)에 올라 있는 실제 단어인지 판정하세요.\n' +
      '인정: 일반 명사, 널리 쓰는 외래어 표기, 널리 쓰는 복합어.\n' +
      '불인정: 철자가 틀린 글자, 존재하지 않는 조합, 뜻 없는 글자 나열, 욕설, 비표준 준말, 문장이나 구.\n' +
      '단어: ' + w + '\n' +
      '다음 JSON만 답하세요. 예: {"valid": true, "reason": "사전에 있는 명사예요."}';
    try {
      const r = await sampleFn.json(prompt, { modelTier: 'quick' });
      if (r && typeof r.valid === 'boolean') {
        const v = { ok: r.valid, reason: String(r.reason || '').slice(0, 60) };
        verdicts.set(w, v);
        return v;
      }
      return { ok: true, failed: true };
    } catch (e) {
      const code = e && e.code;
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) {
        claudeState = code === 'not_granted' ? 'denied' : 'off'; save(false); paintClaude();
      }
      return { ok: true, failed: true };
    }
  }

  /* ---------- time limit (FIX-01) ---------- */
  let timeOn = false, tId = null, deadline = 0, remain = TIME_LIMIT_MS;
  function loadTimePref() { try { return localStorage.getItem('kk-timer') === '1'; } catch (e) { return false; } }
  function saveTimePref(v) { try { localStorage.setItem('kk-timer', v ? '1' : '0'); } catch (e) {} }
  function paintTimer() {
    els.timeSw.checked = timeOn;
    els.timebar.hidden = !(timeOn && state && !state.over);
    els.timerHint.hidden = timeOn;
  }
  function paintBar(left) {
    els.timefill.style.width = (Math.max(0, left) / TIME_LIMIT_MS * 100) + '%';
    els.timebar.classList.toggle('low', left <= 5000);
    els.timebar.setAttribute('aria-valuenow', String(Math.ceil(Math.max(0, left) / 1000)));
  }
  function clearTimer() { if (tId) { clearInterval(tId); tId = null; } }
  function tick() {
    const left = deadline - Date.now();
    paintBar(left);
    if (left <= 0) timeUp();
  }
  function startTimer(ms) {
    clearTimer();
    if (!timeOn || !state || state.over) { paintTimer(); return; }
    remain = ms == null ? TIME_LIMIT_MS : ms;
    deadline = Date.now() + remain;
    paintTimer(); paintBar(remain);
    tId = setInterval(tick, 100);
  }
  function pauseTimer() { if (tId) { remain = Math.max(0, deadline - Date.now()); clearTimer(); return true; } return false; }
  function stopTimer() { clearTimer(); paintBar(TIME_LIMIT_MS); paintTimer(); }
  function timeUp() {
    clearTimer();
    if (!state || state.over) return;
    state.over = true; state.lose = 'time'; busy = false;
    try { if (NATIVE) NATIVE.SpeechRecognition.stop().catch(() => {}); else if (rec) rec.stop(); } catch (e) {}
    stopSpeech();
    setStatus('');
    paintTimer();
    render();
  }

  /* ---------- game ---------- */
  function newGame(speakFirst) {
    const used = new Set();
    const first = pick(null, used, els.level.value);
    used.add(first);
    state = { history: [{ who: 'app', word: first }], used, over: false, reveal: false, mine: 0, gen: (state ? state.gen : 0) + 1 };
    busy = false;
    setStatus('');
    els.word.value = '';
    render();
    startTimer();
    if (speakFirst && mode() !== 'text') speak(first);
  }
  function lastWord() { return state.history[state.history.length - 1].word; }

  async function submit(raw) {
    if (busy || state.over) return;
    const res = check(raw, lastWord(), state.used);
    if (!res.ok) { setStatus(res.msg, true); return; }
    busy = true;
    const wasRunning = pauseTimer();
    const gen = state.gen;
    setStatus(WORD_SET.has(res.word) || claudeState !== 'on' ? '' : '국어사전에서 확인하는 중…');
    const v = await isWord(res.word);
    if (state.gen !== gen) return; // a new game started meanwhile
    if (!v.ok) {
      busy = false;
      if (wasRunning) startTimer(remain);
      setStatus('‘' + res.word + '’은(는) 사전에 없는 단어 같아요. ' + (v.reason || '다른 단어를 말해 주세요.'), true);
      return;
    }
    setStatus(v.failed ? '사전 확인에 실패해 이 단어를 그대로 인정했어요.' : '');
    stopTimer();
    state.used.add(res.word);
    const prev = lastWord();
    const st = starters(lastChar(prev));
    state.history.push({ who: 'me', word: res.word, dueum: st.length > 1 && res.word[0] !== lastChar(prev) ? lastChar(prev) + '→' + res.word[0] : '' });
    state.mine += 1;
    els.word.value = '';
    render(true);
    setTimeout(appTurn, 650);
  }
  function appTurn() {
    const prev = lastWord();
    const w = pick(prev, state.used, els.level.value);
    busy = false;
    if (!w) { state.over = true; stopTimer(); render(); return; }
    state.used.add(w);
    const st = starters(lastChar(prev));
    state.history.push({ who: 'app', word: w, dueum: st.length > 1 && w[0] !== lastChar(prev) ? lastChar(prev) + '→' + w[0] : '' });
    state.reveal = false;
    render();
    startTimer();
    if (mode() !== 'text') speak(w);
    if (!matchMedia('(pointer: coarse)').matches) els.word.focus();
  }

  /* ---------- render ---------- */
  function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function wordHTML(w) { return esc(w.slice(0, -1)) + '<span class="last">' + esc(lastChar(w)) + '</span>'; }

  function render(thinking) {
    const n = state.history.length;
    els.score.textContent = '이어간 단어 ' + n + ' · 내 단어 ' + state.mine;

    const prev = lastWord();
    const st = starters(lastChar(prev));
    const textMode = mode() !== 'voice';
    if (state.over) {
      els.stage.innerHTML = '<div class="glyphs"><div class="glyph big">' + (state.lose === 'time' ? '패' : '승') + '</div></div><div class="stage-text"><p class="eyebrow">게임 끝</p><p class="stage-title">' + (state.lose === 'time' ? '시간 초과! 20초 안에 잇지 못했어요.' : '이을 단어가 없어요. 내가 이겼어요!') + '</p><p class="stage-sub">‘새 게임’으로 다시 시작해 보세요.</p></div>';
    } else if (textMode || state.reveal) {
      els.stage.innerHTML = '<div class="glyphs"><div class="glyph big">' + esc(st[0]) + '</div>' + (st[1] ? '<div class="glyph alt">' + esc(st[1]) + '</div>' : '') + '</div>' +
        '<div class="stage-text"><p class="eyebrow">이어야 할 글자</p><p class="stage-title">' + esc(prev) + '</p><p class="stage-sub">' + (st[1] ? "두음 법칙으로 ‘" + esc(st[1]) + "’도 가능해요." : '이 글자로 시작하는 단어를 말해 보세요.') + '</p></div>';
    } else {
      els.stage.innerHTML = '<button type="button" class="listen" id="listen" aria-label="앱이 말한 단어 다시 듣기">' + ICON_SPK_BIG + '</button>' +
        '<div class="stage-text"><p class="eyebrow">음성 모드</p><p class="stage-title">마지막 글자를 듣고 이어 말해 보세요.</p><p class="stage-sub"><button type="button" class="link" id="reveal">글자로 확인하기</button></p></div>';
      $('listen').addEventListener('click', () => speak(prev));
      $('reveal').addEventListener('click', () => { state.reveal = true; render(); });
    }

    const frag = [];
    const start = Math.max(0, n - SHOW);
    for (let i = start; i < n; i++) {
      const h = state.history[i];
      const isLastApp = h.who === 'app' && i === n - 1;
      const masked = h.who === 'app' && !textMode && !(isLastApp && state.reveal) && !h.shown;
      const label = h.who === 'app' ? '앱' : '나';
      if (h.who === 'app') {
        const body = masked ? '<span aria-hidden="true">' + '●'.repeat(h.word.length) + '</span>' + ICON_SPK : wordHTML(h.word) + (mode() !== 'text' ? ICON_SPK : '');
        const lab = masked ? '앱의 단어 듣기, 누르면 글자가 보여요' : h.word + ' 다시 듣기';
        frag.push('<li class="entry app' + (masked ? ' masked' : '') + '"><span class="who">' + label + '</span><button type="button" class="tile" data-i="' + i + '" aria-label="' + esc(lab) + '">' + body + '</button>' + (h.dueum ? '<span class="note">두음 법칙 ' + esc(h.dueum) + '</span>' : '') + '</li>');
      } else {
        frag.push('<li class="entry me"><span class="who">' + label + '</span><span class="tile">' + wordHTML(h.word) + '</span>' + (h.dueum ? '<span class="note">두음 법칙 ' + esc(h.dueum) + '</span>' : '') + '</li>');
      }
    }
    if (thinking && !state.over) frag.push('<li class="thinking">앱이 생각하는 중…</li>');
    if (state.over) frag.push('<li class="sys">이어간 단어 ' + n + '개</li>');
    els.chain.innerHTML = frag.join('');
    els.chain.querySelectorAll('button.tile').forEach(b => b.addEventListener('click', () => {
      const h = state.history[+b.dataset.i];
      if (!h) return;
      if (mode() !== 'text') speak(h.word);
      if (mode() === 'voice') { h.shown = true; if (+b.dataset.i === state.history.length - 1) state.reveal = true; render(); }
    }));
    els.word.disabled = state.over;
    els.word.placeholder = state.over ? '새 게임을 시작해 주세요' : (st[1] ? "‘" + st[0] + "’ 또는 ‘" + st[1] + "’(으)로 시작" : "‘" + st[0] + "’(으)로 시작");
  }

  /* ---------- speech in ---------- */
  function micMsg(code) {
    if (code === 'not-allowed' || code === 'service-not-allowed') return '이 화면에서는 마이크가 막혀 있어요. 폰 키보드의 마이크 버튼을 쓰거나, APK 앱으로 만들어 쓰면 해결돼요.';
    if (code === 'no-speech') return '말소리가 들리지 않았어요. 마이크 버튼을 다시 눌러 말해 주세요.';
    if (code === 'audio-capture') return '마이크를 찾을 수 없어요.';
    if (code === 'network') return '음성 인식 서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.';
    if (code === 'language-not-supported') return '이 기기는 한국어 음성 인식을 지원하지 않아요.';
    return '음성 인식에 문제가 생겼어요. 키보드로 입력해 주세요.';
  }
  function nativeMicMsg(e) {
    const m = String((e && (e.message || e)) || '');
    if (/No speech|No match/i.test(m)) return '말소리가 들리지 않았어요. 마이크 버튼을 다시 눌러 말해 주세요.';
    if (/Network|server/i.test(m)) return '음성 인식 서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.';
    if (/permission/i.test(m)) return '마이크 권한이 필요해요. 설정 > 앱 > 끝말잇기 > 권한에서 마이크를 허용해 주세요.';
    if (/busy/i.test(m)) return '음성 인식이 아직 이전 요청을 처리하는 중이에요. 잠시 뒤에 다시 눌러 주세요.';
    if (/Audio/i.test(m)) return '마이크를 사용할 수 없어요. 다른 앱이 마이크를 쓰고 있는지 확인해 주세요.';
    if (/not available|unavailable/i.test(m)) return '이 기기에는 음성 인식 서비스가 없어요. Google 앱을 설치하거나 업데이트해 주세요.';
    return '음성 인식에 문제가 생겼어요. 키보드로 입력해 주세요.';
  }
  async function startMicNative() {
    const RN = NATIVE.SpeechRecognition;
    if (listening) { try { RN.stop(); } catch (e) {} return; } // stop() answers via the pending start()
    if (state.over || busy) return;
    stopSpeech();
    try {
      const av = await RN.available();
      if (!av.available) { setStatus(nativeMicMsg('not available'), true); return; }
      let perm = await RN.checkPermissions();
      if (perm.speechRecognition !== 'granted') perm = await RN.requestPermissions();
      if (perm.speechRecognition !== 'granted') { setStatus(nativeMicMsg('permission'), true); return; }
    } catch (e) { setStatus(nativeMicMsg(e), true); return; }
    listening = true;
    els.mic.classList.add('on'); els.mic.setAttribute('aria-label', '음성 입력 멈추기');
    setStatus('듣고 있어요. 단어를 말해 주세요.');
    try {
      const r = await RN.start({ language: 'ko-KR', maxResults: 3, partialResults: false, popup: false });
      const list = ((r && r.matches) || []).map(m => String(m).replace(/\s+/g, ''));
      if (!list.length) { setStatus(nativeMicMsg('No speech'), true); }
      else {
        let best = list[0];
        for (const m of list) { if (check(m, lastWord(), state.used).ok) { best = m; break; } }
        els.word.value = best; setStatus('');
        submit(best);
      }
    } catch (e) { setStatus(nativeMicMsg(e), true); }
    finally { listening = false; els.mic.classList.remove('on'); els.mic.setAttribute('aria-label', '음성으로 입력'); }
  }
  function startMic() {
    if (NATIVE) { startMicNative(); return; }
    if (!SR) { setStatus('이 화면에서는 음성 인식을 쓸 수 없어요. 폰 키보드의 마이크 버튼을 쓰거나, APK 앱으로 만들어 쓰면 해결돼요.', true); return; }
    if (state.over || busy) return;
    stopSpeech();
    try {
      rec = new SR();
      rec.lang = 'ko-KR';
      rec.interimResults = true;
      rec.maxAlternatives = 3;
      rec.continuous = false;
    } catch (e) { setStatus(micMsg(''), true); return; }
    let finalText = '';
    let failed = false;
    rec.onstart = () => { listening = true; els.mic.classList.add('on'); els.mic.setAttribute('aria-label', '음성 입력 멈추기'); setStatus('듣고 있어요. 단어를 말해 주세요.'); };
    rec.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) {
          let best = r[0].transcript;
          for (let k = 0; k < r.length; k++) { if (check(r[k].transcript.replace(/\s+/g, ''), lastWord(), state.used).ok) { best = r[k].transcript; break; } }
          finalText = best.replace(/\s+/g, '');
        } else interim += r[0].transcript;
      }
      els.word.value = finalText || interim;
    };
    rec.onerror = e => { if (e.error !== 'aborted') { failed = true; setStatus(micMsg(e.error), true); } };
    rec.onend = () => {
      listening = false; els.mic.classList.remove('on'); els.mic.setAttribute('aria-label', '음성으로 입력');
      if (finalText) { setStatus(''); submit(finalText); }
      else if (!failed) setStatus('말소리가 들리지 않았어요. 마이크 버튼을 다시 눌러 말해 주세요.', true);
    };
    try { rec.start(); } catch (e) { setStatus(micMsg(''), true); }
  }
  els.mic.addEventListener('click', () => { if (!NATIVE && listening && rec) { rec.stop(); } else startMic(); });

  /* ---------- wiring ---------- */
  els.form.addEventListener('submit', e => { e.preventDefault(); submit(els.word.value); });
  els.word.addEventListener('keydown', e => { if (e.key === 'Enter' && e.isComposing) e.preventDefault(); });
  els.newGame.addEventListener('click', () => { newGame(true); });
  document.querySelectorAll('input[name="out"]').forEach(r => r.addEventListener('change', () => {
    if (!hasTTS && mode() !== 'text') { $('out-text').checked = true; setStatus('이 기기는 음성 출력을 지원하지 않아요.', true); }
    state.reveal = false; render();
  }));
  if (!hasTTS) { $('out-voice').disabled = true; $('out-both').disabled = true; $('out-text').checked = true; }

  timeOn = loadTimePref();
  els.timeSw.checked = timeOn;
  els.timeSw.addEventListener('change', () => {
    timeOn = els.timeSw.checked;
    saveTimePref(timeOn);
    if (timeOn && state && !state.over && !busy) startTimer(); else stopTimer();
  });

  newGame(false);
})();
</script>
