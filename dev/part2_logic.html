const HANGUL = /^[가-힣]+$/;
const YI = [2, 3, 6, 7, 12, 17, 20]; // ㅑ ㅒ ㅕ ㅖ ㅛ ㅠ ㅣ
function parts(ch) { const c = ch.charCodeAt(0) - 0xAC00; return { cho: Math.floor(c / 588), jung: Math.floor((c % 588) / 28), jong: c % 28 }; }
function make(cho, jung, jong) { return String.fromCharCode(0xAC00 + (cho * 21 + jung) * 28 + jong); }
/* 두음 법칙: 리→이, 라→나, 녀→여 ... */
function dueum(ch) {
  if (!/[가-힣]/.test(ch)) return ch;
  const p = parts(ch);
  if (p.cho === 5) return make(YI.includes(p.jung) ? 11 : 2, p.jung, p.jong);
  if (p.cho === 2 && YI.includes(p.jung)) return make(11, p.jung, p.jong);
  return ch;
}
function starters(ch) { const d = dueum(ch); return d === ch ? [ch] : [ch, d]; }
function lastChar(w) { return w[w.length - 1]; }

const WORDS = Array.from(new Set(WORDS_RAW.split(/\s+/).filter(w => w.length >= 2 && HANGUL.test(w))));
const WORD_LIST = new Set(WORDS);
const BY_START = new Map();
for (const w of WORDS) { const k = w[0]; if (!BY_START.has(k)) BY_START.set(k, []); BY_START.get(k).push(w); }

function candidates(prevWord, used) {
  const out = [];
  for (const s of starters(lastChar(prevWord))) for (const w of (BY_START.get(s) || [])) if (!used.has(w)) out.push(w);
  return out;
}
function continuations(word, used) {
  const next = new Set(used); next.add(word);
  return candidates(word, next).length;
}
function normalize(raw) { return String(raw || '').replace(/[\s.,!?'"“”‘’~·…]/g, ''); }
/* returns {ok, word} or {ok:false, reason, msg} */
/* FIX-02: 내장 목록에 없는 단어에만 적용하는 형태 검사. 목록에 있는 단어는 그대로 통과한다. */
const MAX_FREE_LEN = 6;
const SENTENCE_ENDINGS = ['니다', '어요', '아요', '해요', '세요', '에요', '예요', '까요', '네요', '군요', '지요', '했다', '한다', '된다', '었다', '았다', '겠다', '는다'];
function formCheck(w) {
  if (w.length > MAX_FREE_LEN) return { ok: false, reason: 'long', msg: `너무 길어요. ${MAX_FREE_LEN}글자 이하의 단어를 말해 주세요.` };
  if (/(.)\1\1/.test(w)) return { ok: false, reason: 'repeat', msg: '같은 글자를 반복한 건 단어가 아닌 것 같아요.' };
  if (SENTENCE_ENDINGS.some(e => w.endsWith(e))) return { ok: false, reason: 'sentence', msg: '문장처럼 보여요. 명사 단어를 말해 주세요.' };
  return { ok: true };
}
function check(raw, prevWord, used) {
  if (/\S\s+\S/.test(String(raw || '').trim())) return { ok: false, reason: 'space', msg: '한 단어만 입력해 주세요. 문장은 안 돼요.' };
  const w = normalize(raw);
  if (!w) return { ok: false, reason: 'empty', msg: '단어를 입력해 주세요.' };
  if (!HANGUL.test(w)) return { ok: false, reason: 'hangul', msg: '한글 단어만 입력할 수 있어요.' };
  if (w.length < 2) return { ok: false, reason: 'short', msg: '두 글자 이상의 단어를 말해 주세요.' };
  if (!WORD_LIST.has(w)) { const f = formCheck(w); if (!f.ok) return f; }
  if (prevWord) {
    const st = starters(lastChar(prevWord));
    if (!st.includes(w[0])) return { ok: false, reason: 'chain', msg: `'${st.join("' 또는 '")}'(으)로 시작하는 단어여야 해요.` };
  }
  if (used.has(w)) return { ok: false, reason: 'used', msg: '이미 나온 단어예요.' };
  return { ok: true, word: w };
}
/* level: easy | normal | hard */
function pick(prevWord, used, level) {
  const pool = prevWord ? candidates(prevWord, used) : WORDS.filter(w => !used.has(w));
  if (!pool.length) return null;
  const scored = pool.map(w => ({ w, n: continuations(w, used) }));
  let sel = scored;
  if (level === 'easy') { const good = scored.filter(s => s.n >= 3); if (good.length) sel = good; }
  if (level === 'hard') { const m = Math.min(...scored.map(s => s.n)); sel = scored.filter(s => s.n === m); }
  if (!prevWord) { const good = scored.filter(s => s.n >= 3); if (good.length) sel = good; }
  return sel[Math.floor(Math.random() * sel.length)].w;
}
