<title>끝말잇기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one fixed screen, no scrolling. Header and settings on top, the game (next syllable + last few words) centered, input bar at the bottom. */
:root {
  --bg: #E9F0EE;
  --surface: #F7FAF9;
  --ink: #12272B;
  --ink-2: #4B6166;
  --line: #C9D7D4;
  --app: #12272B;
  --app-ink: #F2F7F5;
  --me: #1C7A6D;
  --me-ink: #FFFFFF;
  --mark: #F4B73F;
  --mark-ink: #2A1D00;
  --danger: #B3362D;
  --focus: #1C7A6D;
  --knob: #FFFFFF;
  --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1A1D; --surface: #14262A; --ink: #E4EEEC; --ink-2: #94ABAF; --line: #2C4146;
    --app: #24393F; --app-ink: #EAF3F1; --me: #2BA595; --me-ink: #06201C;
    --mark: #F4B73F; --mark-ink: #2A1D00; --danger: #F08A80; --focus: #2BA595; --knob: #E4EEEC;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1A1D; --surface: #14262A; --ink: #E4EEEC; --ink-2: #94ABAF; --line: #2C4146;
  --app: #24393F; --app-ink: #EAF3F1; --me: #2BA595; --me-ink: #06201C;
  --mark: #F4B73F; --mark-ink: #2A1D00; --danger: #F08A80; --focus: #2BA595; --knob: #E4EEEC;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.shell { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; min-height: 0; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: none; }
.top h1 { font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1; margin: 0; letter-spacing: 0.02em; }
.score { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; margin: 3px 0 0; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 500; }

.claude-row { display: flex; align-items: center; gap: 12px; flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; }
.sw { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; font-size: 14px; flex: none; }
.sw input { position: absolute; inset: 0 auto 0 0; width: 44px; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.track { position: relative; width: 44px; height: 26px; border-radius: 13px; background: var(--line); flex: none; transition: background 0.15s; }
.knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--knob); transition: transform 0.15s; }
.sw input:checked + .track { background: var(--me); }
.sw input:checked + .track .knob { transform: translateX(18px); }
.sw input:disabled + .track { opacity: 0.55; }
.sw input:disabled { cursor: not-allowed; }
.sw input:focus-visible + .track { outline: 3px solid var(--focus); outline-offset: 2px; }
.sw-state { font-size: 12px; color: var(--ink-2); min-width: 0; line-height: 1.3; }

.settings { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { padding: 7px 13px; cursor: pointer; font-size: 14px; border-right: 1px solid var(--line); }
.seg label:last-of-type { border-right: 0; }
.seg input:checked + label { background: var(--ink); color: var(--bg); }
.seg input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: -3px; }
.seg input:disabled + label { opacity: 0.45; cursor: not-allowed; }
select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 8px; }

.play { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 12px; }

.stage { flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 14px; }
.glyphs { display: flex; gap: 8px; align-items: center; flex: none; }
.glyph { font-family: var(--font-display); line-height: 1; display: grid; place-items: center; border-radius: 10px; }
.glyph.big { width: 72px; height: 72px; font-size: 48px; background: var(--mark); color: var(--mark-ink); }
.glyph.alt { width: 48px; height: 48px; font-size: 30px; border: 2px solid var(--mark); color: var(--ink); }
.stage-text { min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: 0.06em; color: var(--ink-2); margin: 0 0 2px; }
.stage-title { font-weight: 600; font-size: 16px; margin: 0; overflow-wrap: anywhere; }
.stage-sub { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }
.link { background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; color: var(--ink-2); font-size: 13px; }
.listen { width: 72px; height: 72px; border-radius: 10px; border: 0; background: var(--mark); color: var(--mark-ink); cursor: pointer; display: grid; place-items: center; flex: none; }

.chain { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; overflow: hidden; min-height: 0; flex: 0 1 auto; }
.entry { display: flex; flex-direction: column; gap: 2px; max-width: 90%; flex: none; }
.entry.app { align-self: flex-start; align-items: flex-start; }
.entry.me { align-self: flex-end; align-items: flex-end; }
.who { font-size: 11px; letter-spacing: 0.06em; color: var(--ink-2); }
.tile { font-family: var(--font-display); font-size: 24px; line-height: 1.15; padding: 7px 12px; border-radius: 12px; display: inline-flex; align-items: center; gap: 10px; border: 0; text-align: left; }
.entry.app .tile { background: var(--app); color: var(--app-ink); }
.entry.me .tile { background: var(--me); color: var(--me-ink); }
.last { background: var(--mark); color: var(--mark-ink); border-radius: 6px; padding: 0 4px; margin-left: 1px; }
.entry.masked .tile { cursor: pointer; letter-spacing: 0.3em; }
.tile .spk { width: 22px; height: 22px; opacity: 0.8; flex: none; }
.note { font-size: 12px; color: var(--ink-2); }
.sys { align-self: center; text-align: center; color: var(--ink); font-size: 13px; padding: 6px 12px; border: 1px solid var(--mark); border-radius: 8px; flex: none; }
.thinking { align-self: flex-start; color: var(--ink-2); font-size: 13px; flex: none; }

.status { flex: none; min-height: 34px; font-size: 13px; line-height: 1.3; color: var(--ink-2); margin: 0; }
.status.err { color: var(--danger); }

.bar { display: flex; gap: 8px; flex: none; }
.bar input[type="text"] { flex: 1; min-width: 0; font-size: 18px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.bar input[type="text"]::placeholder { color: var(--ink-2); font-size: 15px; }
.icon-btn { width: 50px; flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; cursor: pointer; display: grid; place-items: center; }
.icon-btn.on { background: var(--danger); border-color: var(--danger); color: var(--bg); }
.icon-btn.on svg { animation: pulse 1.1s ease-in-out infinite; }
.send { border: 0; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 0 16px; font-weight: 600; cursor: pointer; }
@keyframes pulse { 50% { transform: scale(1.18); } }
@media (prefers-reduced-motion: reduce) { .icon-btn.on svg { animation: none; } .track, .knob { transition: none; } }
svg { display: block; }

/* short screens (small phones, keyboard open) */
@media (max-height: 640px) {
  .glyph.big, .listen { width: 56px; height: 56px; font-size: 38px; }
  .glyph.alt { width: 40px; height: 40px; font-size: 24px; }
  .tile { font-size: 20px; padding: 5px 10px; }
  .stage { padding: 8px 12px; }
  .status { min-height: 18px; }
  .play { gap: 8px; }
}
@media (max-height: 500px) {
  .score, .eyebrow, .stage-sub, .who { display: none; }
}

/* FIX-01: time limit row (switch + shrinking bar) */
.timer-row { display: flex; align-items: center; gap: 12px; flex: none; min-height: 26px; }
.timebar { flex: 1; min-width: 0; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.timebar[hidden] { display: none; }
.timebar .fill { height: 100%; width: 100%; background: var(--me); border-radius: 4px; }
.timebar.low .fill { background: var(--danger); }
.stage-title { word-break: keep-all; }
.timer-hint { flex: 1; min-width: 0; font-size: 12px; color: var(--ink-2); }
@media (max-height: 500px) { .timer-row { min-height: 22px; } }

/* C: dictionary attribution */
.top-actions { display: flex; gap: 8px; align-items: center; }
.btn-icon { padding: 8px 10px; font-size: 13px; color: var(--ink-2); }
.info { max-width: min(92vw, 440px); border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); padding: 18px; }
.info::backdrop { background: rgba(0, 0, 0, 0.45); }
.info h2 { font-family: var(--font-display); font-weight: 400; font-size: 20px; margin: 0 0 8px; }
.info p { margin: 0 0 10px; line-height: 1.5; font-size: 14px; }
.info .info-meta { font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
.ver { font-family: system-ui, sans-serif; font-size: 11px; letter-spacing: 0; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; vertical-align: middle; margin-left: 4px; }
.dict-row { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; flex: none; width: 100%; text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; cursor: pointer; }
.dict-main { font-size: 13px; min-width: 0; } .dict-main b { margin-right: 4px; }
.dict-sub { font-size: 11.5px; color: var(--ink-2); }
.fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
.fx i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; animation: fxfall 2s ease-in forwards; }
.fx.lose i { width: 6px; height: 6px; border-radius: 50%; background: #7b8a93; opacity: .7; animation-name: fxrain; }
@keyframes fxfall { to { transform: translate(var(--dx, 0), 105vh) rotate(var(--rot, 360deg)); opacity: .9; } }
@keyframes fxrain { to { transform: translateY(105vh); opacity: 0; } }
.stage.pop { animation: fxpop .7s ease-out; }
.stage.shake { animation: fxshake .6s ease-in-out; }
@keyframes fxpop { 0% { transform: scale(.9); } 50% { transform: scale(1.06); } 100% { transform: scale(1); } }
@keyframes fxshake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
.timer-row[hidden] { display: none; }
</style>
