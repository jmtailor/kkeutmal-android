<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#0D1A1D"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}[hidden]{display:none!important}</style><script src="native.js"></script></head><body><title>끝말잇기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one fixed screen, no scrolling. Header and settings on top, the game (next syllable + last few words) centered, input bar at the bottom. */
:root {
  --bg: #E9F0EE;
  --surface: #F7FAF9;
  --ink: #12272B;
  --ink-2: #4B6166;
  --line: #C9D7D4;
  --app: #12272B;
  --app-ink: #F2F7F5;
  --me: #1C7A6D;
  --me-ink: #FFFFFF;
  --mark: #F4B73F;
  --mark-ink: #2A1D00;
  --danger: #B3362D;
  --focus: #1C7A6D;
  --knob: #FFFFFF;
  --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1A1D; --surface: #14262A; --ink: #E4EEEC; --ink-2: #94ABAF; --line: #2C4146;
    --app: #24393F; --app-ink: #EAF3F1; --me: #2BA595; --me-ink: #06201C;
    --mark: #F4B73F; --mark-ink: #2A1D00; --danger: #F08A80; --focus: #2BA595; --knob: #E4EEEC;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1A1D; --surface: #14262A; --ink: #E4EEEC; --ink-2: #94ABAF; --line: #2C4146;
  --app: #24393F; --app-ink: #EAF3F1; --me: #2BA595; --me-ink: #06201C;
  --mark: #F4B73F; --mark-ink: #2A1D00; --danger: #F08A80; --focus: #2BA595; --knob: #E4EEEC;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.shell { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; min-height: 0; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: none; }
.top h1 { font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1; margin: 0; letter-spacing: 0.02em; }
.score { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; margin: 3px 0 0; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 500; }

.claude-row { display: flex; align-items: center; gap: 12px; flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; }
.sw { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; font-size: 14px; flex: none; }
.sw input { position: absolute; inset: 0 auto 0 0; width: 44px; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.track { position: relative; width: 44px; height: 26px; border-radius: 13px; background: var(--line); flex: none; transition: background 0.15s; }
.knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--knob); transition: transform 0.15s; }
.sw input:checked + .track { background: var(--me); }
.sw input:checked + .track .knob { transform: translateX(18px); }
.sw input:disabled + .track { opacity: 0.55; }
.sw input:disabled { cursor: not-allowed; }
.sw input:focus-visible + .track { outline: 3px solid var(--focus); outline-offset: 2px; }
.sw-state { font-size: 12px; color: var(--ink-2); min-width: 0; line-height: 1.3; }

.settings { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { padding: 7px 13px; cursor: pointer; font-size: 14px; border-right: 1px solid var(--line); }
.seg label:last-of-type { border-right: 0; }
.seg input:checked + label { background: var(--ink); color: var(--bg); }
.seg input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: -3px; }
.seg input:disabled + label { opacity: 0.45; cursor: not-allowed; }
select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 8px; }

.play { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 12px; }

.stage { flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 14px; }
.glyphs { display: flex; gap: 8px; align-items: center; flex: none; }
.glyph { font-family: var(--font-display); line-height: 1; display: grid; place-items: center; border-radius: 10px; }
.glyph.big { width: 72px; height: 72px; font-size: 48px; background: var(--mark); color: var(--mark-ink); }
.glyph.alt { width: 48px; height: 48px; font-size: 30px; border: 2px solid var(--mark); color: var(--ink); }
.stage-text { min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: 0.06em; color: var(--ink-2); margin: 0 0 2px; }
.stage-title { font-weight: 600; font-size: 16px; margin: 0; overflow-wrap: anywhere; }
.stage-sub { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }
.link { background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; color: var(--ink-2); font-size: 13px; }
.listen { width: 72px; height: 72px; border-radius: 10px; border: 0; background: var(--mark); color: var(--mark-ink); cursor: pointer; display: grid; place-items: center; flex: none; }

.chain { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; overflow: hidden; min-height: 0; flex: 0 1 auto; }
.entry { display: flex; flex-direction: column; gap: 2px; max-width: 90%; flex: none; }
.entry.app { align-self: flex-start; align-items: flex-start; }
.entry.me { align-self: flex-end; align-items: flex-end; }
.who { font-size: 11px; letter-spacing: 0.06em; color: var(--ink-2); }
.tile { font-family: var(--font-display); font-size: 24px; line-height: 1.15; padding: 7px 12px; border-radius: 12px; display: inline-flex; align-items: center; gap: 10px; border: 0; text-align: left; }
.entry.app .tile { background: var(--app); color: var(--app-ink); }
.entry.me .tile { background: var(--me); color: var(--me-ink); }
.last { background: var(--mark); color: var(--mark-ink); border-radius: 6px; padding: 0 4px; margin-left: 1px; }
.entry.masked .tile { cursor: pointer; letter-spacing: 0.3em; }
.tile .spk { width: 22px; height: 22px; opacity: 0.8; flex: none; }
.note { font-size: 12px; color: var(--ink-2); }
.sys { align-self: center; text-align: center; color: var(--ink); font-size: 13px; padding: 6px 12px; border: 1px solid var(--mark); border-radius: 8px; flex: none; }
.thinking { align-self: flex-start; color: var(--ink-2); font-size: 13px; flex: none; }

.status { flex: none; min-height: 34px; font-size: 13px; line-height: 1.3; color: var(--ink-2); margin: 0; }
.status.err { color: var(--danger); }

.bar { display: flex; gap: 8px; flex: none; }
.bar input[type="text"] { flex: 1; min-width: 0; font-size: 18px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.bar input[type="text"]::placeholder { color: var(--ink-2); font-size: 15px; }
.icon-btn { width: 50px; flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; cursor: pointer; display: grid; place-items: center; }
.icon-btn.on { background: var(--danger); border-color: var(--danger); color: var(--bg); }
.icon-btn.on svg { animation: pulse 1.1s ease-in-out infinite; }
.send { border: 0; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 0 16px; font-weight: 600; cursor: pointer; }
@keyframes pulse { 50% { transform: scale(1.18); } }
@media (prefers-reduced-motion: reduce) { .icon-btn.on svg { animation: none; } .track, .knob { transition: none; } }
svg { display: block; }

/* short screens (small phones, keyboard open) */
@media (max-height: 640px) {
  .glyph.big, .listen { width: 56px; height: 56px; font-size: 38px; }
  .glyph.alt { width: 40px; height: 40px; font-size: 24px; }
  .tile { font-size: 20px; padding: 5px 10px; }
  .stage { padding: 8px 12px; }
  .status { min-height: 18px; }
  .play { gap: 8px; }
}
@media (max-height: 500px) {
  .score, .eyebrow, .stage-sub, .who { display: none; }
}
</style>

const HANGUL = /^[가-힣]+$/;
const YI = [2, 3, 6, 7, 12, 17, 20]; // ㅑ ㅒ ㅕ ㅖ ㅛ ㅠ ㅣ
function parts(ch) { const c = ch.charCodeAt(0) - 0xAC00; return { cho: Math.floor(c / 588), jung: Math.floor((c % 588) / 28), jong: c % 28 }; }
function make(cho, jung, jong) { return String.fromCharCode(0xAC00 + (cho * 21 + jung) * 28 + jong); }
/* 두음 법칙: 리→이, 라→나, 녀→여 ... */
function dueum(ch) {
  if (!/[가-힣]/.test(ch)) return ch;
  const p = parts(ch);
  if (p.cho === 5) return make(YI.includes(p.jung) ? 11 : 2, p.jung, p.jong);
  if (p.cho === 2 && YI.includes(p.jung)) return make(11, p.jung, p.jong);
  return ch;
}
function starters(ch) { const d = dueum(ch); return d === ch ? [ch] : [ch, d]; }
function lastChar(w) { return w[w.length - 1]; }

const WORDS = Array.from(new Set(WORDS_RAW.split(/\s+/).filter(w => w.length >= 2 && HANGUL.test(w))));
const BY_START = new Map();
for (const w of WORDS) { const k = w[0]; if (!BY_START.has(k)) BY_START.set(k, []); BY_START.get(k).push(w); }

function candidates(prevWord, used) {
  const out = [];
  for (const s of starters(lastChar(prevWord))) for (const w of (BY_START.get(s) || [])) if (!used.has(w)) out.push(w);
  return out;
}
function continuations(word, used) {
  const next = new Set(used); next.add(word);
  return candidates(word, next).length;
}
function normalize(raw) { return String(raw || '').replace(/[\s.,!?'"“”‘’~·…]/g, ''); }
/* returns {ok, word} or {ok:false, reason, msg} */
function check(raw, prevWord, used) {
  const w = normalize(raw);
  if (!w) return { ok: false, reason: 'empty', msg: '단어를 입력해 주세요.' };
  if (!HANGUL.test(w)) return { ok: false, reason: 'hangul', msg: '한글 단어만 입력할 수 있어요.' };
  if (w.length < 2) return { ok: false, reason: 'short', msg: '두 글자 이상의 단어를 말해 주세요.' };
  if (prevWord) {
    const st = starters(lastChar(prevWord));
    if (!st.includes(w[0])) return { ok: false, reason: 'chain', msg: `'${st.join("' 또는 '")}'(으)로 시작하는 단어여야 해요.` };
  }
  if (used.has(w)) return { ok: false, reason: 'used', msg: '이미 나온 단어예요.' };
  return { ok: true, word: w };
}
/* level: easy | normal | hard */
function pick(prevWord, used, level) {
  const pool = prevWord ? candidates(prevWord, used) : WORDS.filter(w => !used.has(w));
  if (!pool.length) return null;
  const scored = pool.map(w => ({ w, n: continuations(w, used) }));
  let sel = scored;
  if (level === 'easy') { const good = scored.filter(s => s.n >= 3); if (good.length) sel = good; }
  if (level === 'hard') { const m = Math.min(...scored.map(s => s.n)); sel = scored.filter(s => s.n === m); }
  if (!prevWord) { const good = scored.filter(s => s.n >= 3); if (good.length) sel = good; }
  return sel[Math.floor(Math.random() * sel.length)].w;
}

<script id="ui">
(function () {
  const $ = id => document.getElementById(id);
  const els = { score: $('score'), stage: $('stage'), chain: $('chain'), status: $('status'), form: $('form'), word: $('word'), mic: $('mic'), level: $('level'), newGame: $('newGame'), sw: $('claudeSw'), swState: $('swState'), claudeRow: $('claudeRow') };
  const SHOW = 4; // words kept on screen

  const ICON_SPK = '<svg class="spk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
  const ICON_SPK_BIG = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';

  let state;
  let busy = false;
  let listening = false;
  let rec = null;

  const NATIVE = window.KK_NATIVE || null; // set by native.js inside the Android app
  const hasTTS = !!NATIVE || ('speechSynthesis' in window && 'SpeechSynthesisUtterance' in window);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  function mode() { const r = document.querySelector('input[name="out"]:checked'); return r ? r.value : 'both'; }
  function setStatus(msg, err) { els.status.textContent = msg || ''; els.status.classList.toggle('err', !!err); }

  /* ---------- speech out ---------- */
  function koVoice() {
    if (!hasTTS) return null;
    const vs = speechSynthesis.getVoices();
    return vs.find(v => /^ko/i.test(v.lang)) || null;
  }
  function stopSpeech() {
    try {
      if (NATIVE) NATIVE.TextToSpeech.stop().catch(() => {});
      else if (hasTTS) speechSynthesis.cancel();
    } catch (e) {}
  }
  function speak(text) {
    if (!hasTTS) return;
    if (NATIVE) {
      NATIVE.TextToSpeech.speak({ text, lang: 'ko-KR', rate: 0.95, pitch: 1.0, volume: 1.0 }).catch(() => {
        setStatus('음성 출력에 실패했어요. 휴대폰 설정에서 텍스트 음성 변환(TTS) 엔진을 확인해 주세요.', true);
      });
      return;
    }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = 0.95;
      const v = koVoice(); if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (e) { /* speech output is optional */ }
  }
  if (hasTTS && !NATIVE) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (e) {} }

  /* ---------- Claude dictionary switch ---------- */
  // states: unavail (not opened inside Claude), checking, off, busy (asking permission), on, denied
  const WORD_SET = new Set(WORDS);
  const verdicts = new Map();
  let claudeState = 'unavail';
  let sampleFn = null;
  function saved() { try { return localStorage.getItem('kk-claude') === '1'; } catch (e) { return false; } }
  function save(v) { try { localStorage.setItem('kk-claude', v ? '1' : '0'); } catch (e) {} }
  const SW_TEXT = {
    unavail: NATIVE ? '사용 불가 · 앱 버전은 Claude 연결이 없어요' : '사용 불가 · Claude 앱 밖에서 실행 중',
    checking: '연결 확인 중…',
    off: '꺼짐 · 한글 두 글자 이상이면 인정',
    busy: '허용 요청 중…',
    on: '켜짐 · 목록에 없는 단어를 Claude가 확인',
    denied: '허용되지 않아 꺼졌어요'
  };
  function paintClaude() {
    els.sw.checked = claudeState === 'on' || claudeState === 'busy';
    els.sw.disabled = claudeState === 'unavail' || claudeState === 'checking' || claudeState === 'busy';
    els.swState.textContent = SW_TEXT[claudeState];
  }
  if (window.claude && window.claude.use) {
    claudeState = 'checking';
    window.claude.use('sample').then(f => {
      sampleFn = f || null;
      claudeState = f ? (saved() ? 'on' : 'off') : 'unavail';
      paintClaude();
    }).catch(() => { claudeState = 'unavail'; paintClaude(); });
  }
  paintClaude();

  els.sw.addEventListener('change', async () => {
    if (!sampleFn) { paintClaude(); return; }
    if (!els.sw.checked) { claudeState = 'off'; save(false); paintClaude(); return; }
    claudeState = 'busy'; paintClaude();
    try {
      await sampleFn.json('JSON만 답하세요: {"ok": true}', { modelTier: 'quick' });
      claudeState = 'on'; save(true); setStatus('');
    } catch (e) {
      if (e && e.code === 'not_granted') { claudeState = 'denied'; save(false); }
      else { claudeState = 'off'; setStatus('Claude 연결에 실패했어요. 잠시 뒤 다시 켜 주세요.', true); }
    }
    paintClaude();
  });
  els.claudeRow.addEventListener('click', () => {
    if (claudeState === 'unavail') setStatus((NATIVE ? '설치한 앱에는 Claude 연결이 없어서 ' : 'Claude 사전 확인은 Claude 앱 안에서 열었을 때만 쓸 수 있어요. ') + '지금은 한글 두 글자 이상이면 단어로 인정해요.');
  });

  async function isWord(w) {
    if (WORD_SET.has(w)) return { ok: true };
    if (verdicts.has(w)) return verdicts.get(w);
    if (claudeState !== 'on' || !sampleFn) return { ok: true, skipped: true };
    const prompt = '한국어 끝말잇기 심판입니다. 아래 단어가 국어사전(표준국어대사전)에 올라 있는 실제 단어인지 판정하세요.\n' +
      '인정: 일반 명사, 널리 쓰는 외래어 표기, 널리 쓰는 복합어.\n' +
      '불인정: 철자가 틀린 글자, 존재하지 않는 조합, 뜻 없는 글자 나열, 욕설, 비표준 준말, 문장이나 구.\n' +
      '단어: ' + w + '\n' +
      '다음 JSON만 답하세요. 예: {"valid": true, "reason": "사전에 있는 명사예요."}';
    try {
      const r = await sampleFn.json(prompt, { modelTier: 'quick' });
      if (r && typeof r.valid === 'boolean') {
        const v = { ok: r.valid, reason: String(r.reason || '').slice(0, 60) };
        verdicts.set(w, v);
        return v;
      }
      return { ok: true, failed: true };
    } catch (e) {
      const code = e && e.code;
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) {
        claudeState = code === 'not_granted' ? 'denied' : 'off'; save(false); paintClaude();
      }
      return { ok: true, failed: true };
    }
  }

  /* ---------- game ---------- */
  function newGame(speakFirst) {
    const used = new Set();
    const first = pick(null, used, els.level.value);
    used.add(first);
    state = { history: [{ who: 'app', word: first }], used, over: false, reveal: false, mine: 0, gen: (state ? state.gen : 0) + 1 };
    busy = false;
    setStatus('');
    els.word.value = '';
    render();
    if (speakFirst && mode() !== 'text') speak(first);
  }
  function lastWord() { return state.history[state.history.length - 1].word; }

  async function submit(raw) {
    if (busy || state.over) return;
    const res = check(raw, lastWord(), state.used);
    if (!res.ok) { setStatus(res.msg, true); return; }
    busy = true;
    const gen = state.gen;
    setStatus(WORD_SET.has(res.word) || claudeState !== 'on' ? '' : '국어사전에서 확인하는 중…');
    const v = await isWord(res.word);
    if (state.gen !== gen) return; // a new game started meanwhile
    if (!v.ok) {
      busy = false;
      setStatus('‘' + res.word + '’은(는) 사전에 없는 단어 같아요. ' + (v.reason || '다른 단어를 말해 주세요.'), true);
      return;
    }
    setStatus(v.failed ? '사전 확인에 실패해 이 단어를 그대로 인정했어요.' : '');
    state.used.add(res.word);
    const prev = lastWord();
    const st = starters(lastChar(prev));
    state.history.push({ who: 'me', word: res.word, dueum: st.length > 1 && res.word[0] !== lastChar(prev) ? lastChar(prev) + '→' + res.word[0] : '' });
    state.mine += 1;
    els.word.value = '';
    render(true);
    setTimeout(appTurn, 650);
  }
  function appTurn() {
    const prev = lastWord();
    const w = pick(prev, state.used, els.level.value);
    busy = false;
    if (!w) { state.over = true; render(); return; }
    state.used.add(w);
    const st = starters(lastChar(prev));
    state.history.push({ who: 'app', word: w, dueum: st.length > 1 && w[0] !== lastChar(prev) ? lastChar(prev) + '→' + w[0] : '' });
    state.reveal = false;
    render();
    if (mode() !== 'text') speak(w);
    if (!matchMedia('(pointer: coarse)').matches) els.word.focus();
  }

  /* ---------- render ---------- */
  function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function wordHTML(w) { return esc(w.slice(0, -1)) + '<span class="last">' + esc(lastChar(w)) + '</span>'; }

  function render(thinking) {
    const n = state.history.length;
    els.score.textContent = '이어간 단어 ' + n + ' · 내 단어 ' + state.mine;

    const prev = lastWord();
    const st = starters(lastChar(prev));
    const textMode = mode() !== 'voice';
    if (state.over) {
      els.stage.innerHTML = '<div class="glyphs"><div class="glyph big">승</div></div><div class="stage-text"><p class="eyebrow">게임 끝</p><p class="stage-title">이을 단어가 없어요. 내가 이겼어요!</p><p class="stage-sub">‘새 게임’으로 다시 시작해 보세요.</p></div>';
    } else if (textMode || state.reveal) {

        '<div class="stage-text"><p class="eyebrow">이어야 할 글자</p><p class="stage-title">' + esc(prev) + '</p><p class="stage-sub">' + (st[1] ? "두음 법칙으로 ‘" + esc(st[1]) + "’도 가능해요." : '이 글자로 시작하는 단어를 말해 보세요.') + '</p></div>';
    } else {
      els.stage.innerHTML = '<button type="button" class="listen" id="listen" aria-label="앱이 말한 단어 다시 듣기">' + ICON_SPK_BIG + '</button>' +
        '<div class="stage-text"><p class="eyebrow">음성 모드</p><p class="stage-title">마지막 글자를 듣고 이어 말해 보세요.</p><p class="stage-sub"><button type="button" class="link" id="reveal">글자로 확인하기</button></p></div>';
      $('listen').addEventListener('click', () => speak(prev));
      $('reveal').addEventListener('click', () => { state.reveal = true; render(); });
    }

    const frag = [];
    const start = Math.max(0, n - SHOW);
    for (let i = start; i < n; i++) {
      const h = state.history[i];
      const isLastApp = h.who === 'app' && i === n - 1;
      const masked = h.who === 'app' && !textMode && !(isLastApp && state.reveal) && !h.shown;
      const label = h.who === 'app' ? '앱' : '나';
      if (h.who === 'app') {
        const body = masked ? '<span aria-hidden="true">' + '●'.repeat(h.word.length) + '</span>' + ICON_SPK : wordHTML(h.word) + (mode() !== 'text' ? ICON_SPK : '');
        const lab = masked ? '앱의 단어 듣기, 누르면 글자가 보여요' : h.word + ' 다시 듣기';
        frag.push('<li class="entry app' + (masked ? ' masked' : '') + '"><span class="who">' + label + '</span><button type="button" class="tile" data-i="' + i + '" aria-label="' + esc(lab) + '">' + body + '</button>' + (h.dueum ? '<span class="note">두음 법칙 ' + esc(h.dueum) + '</span>' : '') + '</li>');
      } else {
        frag.push('<li class="entry me"><span class="who">' + label + '</span><span class="tile">' + wordHTML(h.word) + '</span>' + (h.dueum ? '<span class="note">두음 법칙 ' + esc(h.dueum) + '</span>' : '') + '</li>');
      }
    }
    if (thinking && !state.over) frag.push('<li class="thinking">앱이 생각하는 중…</li>');
    if (state.over) frag.push('<li class="sys">이어간 단어 ' + n + '개</li>');
    els.chain.innerHTML = frag.join('');
    els.chain.querySelectorAll('button.tile').forEach(b => b.addEventListener('click', () => {
      const h = state.history[+b.dataset.i];
      if (!h) return;
      if (mode() !== 'text') speak(h.word);
      if (mode() === 'voice') { h.shown = true; if (+b.dataset.i === state.history.length - 1) state.reveal = true; render(); }
    }));
    els.word.disabled = state.over;
    els.word.placeholder = state.over ? '새 게임을 시작해 주세요' : (st[1] ? "‘" + st[0] + "’ 또는 ‘" + st[1] + "’(으)로 시작" : "‘" + st[0] + "’(으)로 시작");
  }

  /* ---------- speech in ---------- */
  function micMsg(code) {
    if (code === 'not-allowed' || code === 'service-not-allowed') return '이 화면에서는 마이크가 막혀 있어요. 폰 키보드의 마이크 버튼을 쓰거나, APK 앱으로 만들어 쓰면 해결돼요.';
    if (code === 'no-speech') return '말소리가 들리지 않았어요. 마이크 버튼을 다시 눌러 말해 주세요.';
    if (code === 'audio-capture') return '마이크를 찾을 수 없어요.';
    if (code === 'network') return '음성 인식 서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.';
    if (code === 'language-not-supported') return '이 기기는 한국어 음성 인식을 지원하지 않아요.';
    return '음성 인식에 문제가 생겼어요. 키보드로 입력해 주세요.';
  }
  function nativeMicMsg(e) {
    const m = String((e && (e.message || e)) || '');
    if (/No speech|No match/i.test(m)) return '말소리가 들리지 않았어요. 마이크 버튼을 다시 눌러 말해 주세요.';
    if (/Network|server/i.test(m)) return '음성 인식 서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.';
    if (/permission/i.test(m)) return '마이크 권한이 필요해요. 설정 > 앱 > 끝말잇기 > 권한에서 마이크를 허용해 주세요.';
    if (/busy/i.test(m)) return '음성 인식이 아직 이전 요청을 처리하는 중이에요. 잠시 뒤에 다시 눌러 주세요.';
    if (/Audio/i.test(m)) return '마이크를 사용할 수 없어요. 다른 앱이 마이크를 쓰고 있는지 확인해 주세요.';
    if (/not available|unavailable/i.test(m)) return '이 기기에는 음성 인식 서비스가 없어요. Google 앱을 설치하거나 업데이트해 주세요.';
    return '음성 인식에 문제가 생겼어요. 키보드로 입력해 주세요.';
  }
  async function startMicNative() {
    const RN = NATIVE.SpeechRecognition;
    if (listening) { try { RN.stop(); } catch (e) {} return; } // stop() answers via the pending start()
    if (state.over || busy) return;
    stopSpeech();
    try {
      const av = await RN.available();
      if (!av.available) { setStatus(nativeMicMsg('not available'), true); return; }
      let perm = await RN.checkPermissions();
      if (perm.speechRecognition !== 'granted') perm = await RN.requestPermissions();
      if (perm.speechRecognition !== 'granted') { setStatus(nativeMicMsg('permission'), true); return; }
    } catch (e) { setStatus(nativeMicMsg(e), true); return; }
    listening = true;
    els.mic.classList.add('on'); els.mic.setAttribute('aria-label', '음성 입력 멈추기');
    setStatus('듣고 있어요. 단어를 말해 주세요.');
    try {
      const r = await RN.start({ language: 'ko-KR', maxResults: 3, partialResults: false, popup: false });
      const list = (r && r.matches) || [];
      if (!list.length) { setStatus(nativeMicMsg('No speech'), true); }
      else {
        let best = list[0];
        for (const m of list) { if (check(m, lastWord(), state.used).ok) { best = m; break; } }
        els.word.value = best; setStatus('');
        submit(best);
      }
    } catch (e) { setStatus(nativeMicMsg(e), true); }
    finally { listening = false; els.mic.classList.remove('on'); els.mic.setAttribute('aria-label', '음성으로 입력'); }
  }
  function startMic() {
    if (NATIVE) { startMicNative(); return; }
    if (!SR) { setStatus('이 화면에서는 음성 인식을 쓸 수 없어요. 폰 키보드의 마이크 버튼을 쓰거나, APK 앱으로 만들어 쓰면 해결돼요.', true); return; }
    if (state.over || busy) return;
    stopSpeech();
    try {
      rec = new SR();
      rec.lang = 'ko-KR';
      rec.interimResults = true;
      rec.maxAlternatives = 3;
      rec.continuous = false;
    } catch (e) { setStatus(micMsg(''), true); return; }
    let finalText = '';
    let failed = false;
    rec.onstart = () => { listening = true; els.mic.classList.add('on'); els.mic.setAttribute('aria-label', '음성 입력 멈추기'); setStatus('듣고 있어요. 단어를 말해 주세요.'); };
    rec.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) {
          let best = r[0].transcript;
          for (let k = 0; k < r.length; k++) { if (check(r[k].transcript, lastWord(), state.used).ok) { best = r[k].transcript; break; } }
          finalText = best;
        } else interim += r[0].transcript;
      }
      els.word.value = finalText || interim;
    };
    rec.onerror = e => { if (e.error !== 'aborted') { failed = true; setStatus(micMsg(e.error), true); } };
    rec.onend = () => {
      listening = false; els.mic.classList.remove('on'); els.mic.setAttribute('aria-label', '음성으로 입력');
      if (finalText) { setStatus(''); submit(finalText); }
      else if (!failed) setStatus('말소리가 들리지 않았어요. 마이크 버튼을 다시 눌러 말해 주세요.', true);
    };
    try { rec.start(); } catch (e) { setStatus(micMsg(''), true); }
  }
  els.mic.addEventListener('click', () => { if (!NATIVE && listening && rec) { rec.stop(); } else startMic(); });

  /* ---------- wiring ---------- */
  els.form.addEventListener('submit', e => { e.preventDefault(); submit(els.word.value); });
  els.word.addEventListener('keydown', e => { if (e.key === 'Enter' && e.isComposing) e.preventDefault(); });
  els.newGame.addEventListener('click', () => { newGame(true); });
  document.querySelectorAll('input[name="out"]').forEach(r => r.addEventListener('change', () => {
    if (!hasTTS && mode() !== 'text') { $('out-text').checked = true; setStatus('이 기기는 음성 출력을 지원하지 않아요.', true); }
    state.reveal = false; render();
  }));
  if (!hasTTS) { $('out-voice').disabled = true; $('out-both').disabled = true; $('out-text').checked = true; }

  newGame(false);
})();
</script>
</body></html>
