name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci
      - run: npm run sync
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kkeutmal-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FIX=$(grep -o 'FIX-[0-9]*' www/index.html | head -1)
          FIX=${FIX:-FIX-0}
          cp android/app/build/outputs/apk/debug/app-debug.apk "kkeutmal-${FIX}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk kkeutmal-debug.apk
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk "kkeutmal-${FIX}.apk" kkeutmal-debug.apk --title "끝말잇기 ${FIX} debug APK" --notes "자동 빌드된 디버그 APK (${FIX}). kkeutmal-debug.apk는 같은 파일의 고정 주소용 사본입니다." --target "$GITHUB_SHA"
